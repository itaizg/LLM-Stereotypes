# The exam catalog: which exams are in scope and which editions exist (FR-001..FR-006).
# Format: specs/001-exam-data-aggregation/contracts/manifests.md.
#
# STATUS: the exam registry below is a skeleton. `pipeline catalog` exits 3 until the
# maintainer has (1) filled in each exam's domains, seeds, and keys_evidence from the
# official body's own site, and (2) authored an edition with evidence for every one of
# the 66 exam-year cells. That refusal is the intended FR-003 gate, not a bug.
#
# Nothing here is guessed. A domain is an allowlist entry (FR-008): a wrong one lets the
# fetcher talk to the wrong site, and a missing one just blocks fetching. So domains stay
# empty until the maintainer confirms them. The same goes for keys_evidence (FR-006: an
# exam is in scope only if its official body publishes answer keys) and for editions
# (evidence must cite a source the maintainer has approved).
#
# The `parse` blocks are provisional placeholders so the file loads. Each exam's real
# item and choice markers come from its actual paper layout (research R8) and are set
# when extraction first runs on that exam.
#
# keys_evidence (FR-006): each exam must cite an approved source showing that its official
# body publishes answer keys. The flow is: author at least one edition below; run
# `pipeline discover --add-url URL --edition EDITION_ID` (the edition selects the
# allowlist); run `pipeline review SOURCE_ID --approve --edition EDITION_ID --role key`;
# then set `keys_evidence: {source_id: SOURCE_ID, note: "..."}` on the exam. An exam whose
# body does not publish keys is out of scope: removing it is a spec change, and
# `publishes_keys: false` makes `pipeline catalog` refuse.
#
# auto_fetch (FR-007 as amended): an optional list of URL regexes per exam. `fetch` also
# takes pending candidates whose URL fully matches one, if their domain is allowlisted, so
# an official file host's hundreds of PDFs need no review one by one. Such a file is
# stored and logged; it becomes an artifact only when `pipeline review --approve` links it
# to an edition.
version: 1

translation:
  model: claude-sonnet-5-5
  base_url: https://api.anthropic.com/v1/

defaults:
  rate_limit_seconds: 5

exams:
  sat:
    name: SAT
    body: College Board
    language: en
    publishes_keys: true # TODO: cite an approved College Board answer-key source in keys_evidence (see header)
    domains: [satsuite.collegeboard.org]
    seeds:
      # College Board's full-length, nonadaptive SAT practice tests (FR-005: kind practice).
      - url: https://satsuite.collegeboard.org/practice/practice-tests/paper
        complete_listing: false
    # Only the SAT test and answer-explanation PDFs; PSAT, scoring guides and essays are not
    # in scope.
    auto_fetch: ['https://satsuite\.collegeboard\.org/media/pdf/sat-practice-test-\d+(-answers)?-digital\.pdf']
    parse: &provisional_parse
      item_marker: '^(\d+)\.'
      choice_markers: [A, B, C, D]
      columns: 1
      key_table: '^(\d+)\s+([A-D])$'

  psychometric:
    name: Psychometric Entrance Test
    body: National Institute for Testing and Evaluation (NITE)
    language: he
    publishes_keys: true # TODO: cite an approved NITE answer-key source in keys_evidence (see header)
    domains: [www.nite.org.il]
    # Not ingested (decided 2026-11-19, TODO.md): NITE's practice-test page publishes no
    # answer keys (FR-006), and its terms forbid use "including for research" without
    # NITE's written consent. No seeds, so nothing is discovered or fetched.
    seeds: []
    parse: *provisional_parse

  csat:
    name: College Scholastic Ability Test (CSAT)
    body: Korea Institute for Curriculum and Evaluation (KICE)
    language: ko
    publishes_keys: true # TODO: cite an approved KICE answer-key source in keys_evidence (see header)
    domains: [www.kice.re.kr, www.suneung.re.kr]
    seeds:
      - url: https://www.suneung.re.kr/
        complete_listing: false
    parse: *provisional_parse

  gaokao:
    name: National College Entrance Examination (Gaokao)
    body: Ministry of Education of the People's Republic of China
    language: zh-Hans
    # TODO (TODO.md): gaokao.neea.edu.cn has commentary (试题评析), not papers or keys. No
    # official answer-key source found yet, so FR-006 is unmet; nothing is fetched.
    publishes_keys: true # unverified, see above
    domains: [www.moe.gov.cn, gaokao.neea.edu.cn]
    seeds:
      - url: https://gaokao.neea.edu.cn/
        complete_listing: false
    parse: *provisional_parse

  common_test:
    name: Common Test for University Admissions (successor to the National Center Test)
    body: National Center for University Entrance Examinations
    language: ja
    publishes_keys: true
    # DNC publishes the answers (正解) for every subject on its kakomondai pages.
    keys_evidence: {source_id: src_c1ddffef6bb4ddd1, note: "DNC answers, 2025 main test, Japanese (国語)"}
    domains: [www.dnc.ac.jp]
    seeds:
      - url: https://www.dnc.ac.jp/kyotsu/
        complete_listing: false
      # DNC keeps only the last three years of papers. R6 (令和6年度) is the January 2024
      # test and R7 the January 2025 test; R8 (2026) is outside the 2015-2025 scope.
      # Past test information: the official test dates (release_date evidence).
      - url: https://www.dnc.ac.jp/kyotsu/kako_shiken_jouhou/index.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kako_shiken_jouhou/r6/index.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kako_shiken_jouhou/r7/index.html
        complete_listing: false
      # Main test (honshiken) and make-up test (tuisaishiken): problems and answers.
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r6/r6_honshiken_mondai.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r6/r6_honsiken_seikai.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r6/r6_tuisaishiken_mondai.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r6/r6_tuisaisiken_seikai.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r7/r7_honshiken_mondai.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r7/r7_honsiken_seikai.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r7/r7_tuisaishiken_mondai.html
        complete_listing: false
      - url: https://www.dnc.ac.jp/kyotsu/kakomondai/r7/r7_tuisaisiken_seikai.html
        complete_listing: false
    # DNC serves every paper, answer table and listening file through its album endpoint.
    auto_fetch: ['https://www\.dnc\.ac\.jp/albums/abm\.php\?.+']
    parse: *provisional_parse

  enem:
    name: Exame Nacional do Ensino Médio (ENEM)
    body: INEP
    language: pt-BR
    publishes_keys: true
    # INEP publishes a gabarito beside every caderno on its provas-e-gabaritos year pages.
    keys_evidence: {source_id: src_12e7cfea1014db84, note: "INEP gabarito, ENEM 2024 regular application, day 1, caderno 1"}
    domains: [www.gov.br, download.inep.gov.br]
    seeds:
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos
        # true only once the page is checked to list every year 2015-2025 (index_absence evidence)
        complete_listing: false
      # The index loads each year's tab with JavaScript from these pages (its data-url
      # attributes), which link extraction does not see, so they are seeds of their own.
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2015
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2016
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2017
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2018
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2019
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2020
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2021
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2022
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2023
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2024
        complete_listing: false
      - url: https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos/2025
        complete_listing: false
    # INEP's file host: every PDF the year pages link to is fetched without a review.
    auto_fetch: ['https?://download\.inep\.gov\.br/.+']
    parse: *provisional_parse

