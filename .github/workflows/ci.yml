name: CI

# The harness jobs (test, harness-smoke) run on the core dependency set only
# (pyyaml/numpy/scipy/matplotlib) against MockBackend -- no GPU, no model
# weights, no network, no API keys. That is a deliberate property of the
# harness, not a CI limitation: see the "model" extra in pyproject.toml for
# what local inference needs.
#
# The "pipeline" job adds the optional pipeline extra and a local Postgres
# service container (loopback only) to test the exam-dataset pipeline. It
# still needs no network, cloud account, or API key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      # pre-commit-uv makes pre-commit build its hook environments with uv
      # instead of pip/virtualenv, so the runner never touches pip.
      - name: Run pre-commit hooks
        run: uvx --with pre-commit-uv pre-commit run --all-files

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install core + dev dependencies
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # tests/pipeline needs the pipeline extra and Postgres, so it has its own
      # job below; the core job proves the harness stands alone.
      - name: pytest
        run: pytest -q --ignore=tests/pipeline

  pipeline:
    name: pipeline pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database on the job's own service container: no secret.
      PIPELINE_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      # Full history: the ledger test compares pipeline/ledger.jsonl with its
      # version at the merge-base with origin/main (research R15).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install core + dev + pipeline dependencies
        run: |
          uv sync --locked --extra dev --extra pipeline
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: pytest (pipeline)
        run: pytest tests/pipeline -q

  harness-smoke:
    name: harness CLI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install core dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The real SAT question bank is College Board material and is not
      # tracked, so CI pairs the real conditions.yaml with the synthetic
      # bank -- assembled by convention as a suite dir, no harness flags.
      - name: Assemble the suite with the synthetic question bank
        run: |
          mkdir -p ci_suites/stereotype_threat
          cp suites/stereotype_threat/conditions.yaml ci_suites/stereotype_threat/
          cp tests/fixtures/synthetic_questions.json \
            ci_suites/stereotype_threat/questions.json

      # Drives the harness through its own CLI rather than importing it,
      # so the run/report/compare contract is covered as a user hits it.
      - name: Run two suites through the CLI against MockBackend
        run: |
          python -m harness run ci_suites/stereotype_threat \
            --backend mock --models ci-baseline --n-samples 5 \
            --mock-target-accuracy 0.55 --results-dir ci_results
          python -m harness run ci_suites/stereotype_threat \
            --backend mock --models ci-candidate --n-samples 5 \
            --mock-target-accuracy 0.85 --results-dir ci_results

      - name: Re-render the report for the baseline run
        run: |
          BASELINE=$(ls -d ci_results/stereotype_threat_ci-baseline_*)
          python -m harness report "$BASELINE" --suites-root ci_suites

      - name: Compare the two runs
        run: |
          BASELINE=$(ls -d ci_results/stereotype_threat_ci-baseline_*)
          CANDIDATE=$(ls -d ci_results/stereotype_threat_ci-candidate_*)
          python -m harness compare "$BASELINE" "$CANDIDATE" \
            --suites-root ci_suites > compare.json
          cat compare.json

      # Asserts the artifacts a run is contractually required to produce,
      # and that the deliberately-injected 30-point accuracy gap between
      # the two runs is actually detected -- i.e. the statistics are wired
      # up, not just running without raising.
      - name: Assert artifacts and detected effect
        run: |
          python - <<'PY'
          import glob
          import json
          import sys
          from pathlib import Path

          baseline = Path(glob.glob("ci_results/stereotype_threat_ci-baseline_*")[0])

          required = [
              "manifest.json",
              "responses.jsonl",
              "scores.csv",
              "stats.json",
              "report.md",
              "plots/accuracy.png",
          ]
          missing = [name for name in required if not (baseline / name).exists()]
          if missing:
              sys.exit(f"run artifacts missing: {missing}")

          stats = json.loads((baseline / "stats.json").read_text())
          if len(stats["accuracies"]) != 12:
              sys.exit(f"expected 12 conditions, got {len(stats['accuracies'])}")
          if len(stats["contrasts"]) != 9:
              sys.exit(f"expected 9 contrasts, got {len(stats['contrasts'])}")

          comparison = json.loads(Path("compare.json").read_text())
          detected = [
              cid
              for cid, r in comparison["comparisons"].items()
              if r["description"] != "not distinguishable from noise"
          ]
          if not detected:
              sys.exit(
                  "compare failed to detect a 30-point injected accuracy gap "
                  "in any of the 12 conditions"
              )

          print(f"OK: {len(detected)}/12 conditions detected the injected gap")
          PY
