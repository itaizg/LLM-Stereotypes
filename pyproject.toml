[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-stereotypes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pre-commit==4.4.0",
    "pre-commit-uv==4.3.0",
    "ty==0.0.96",
]
model = [
    "torch",
    "transformers",
    "accelerate",
    "tqdm",
]
# The exam-dataset pipeline (specs/001-exam-data-aggregation). Kept out of the
# core install so the harness stays small and GPU-free; the harness never
# imports pipeline/ (enforced by tests/pipeline/test_guard.py).
pipeline = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "boto3>=1.35",
    "pyarrow>=17.0",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "openai>=1.50",
]

[project.scripts]
pipeline = "pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*", "pipeline*", "legacy*"]

[tool.ruff]
line-length = 88
target-version = "py313"

extend-exclude = [
    "legacy/*.ipynb",
    "legacy/prompts.py",
    "legacy/utils.py",
    "legacy/BUGS.md",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

allowed-confusables = ["×"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# legacy/ is the preserved pre-harness code (exempt per the constitution);
# .specify/ is vendored Spec Kit tooling, not project code.
exclude = ["legacy/", ".specify/"]

[tool.ty.analysis]
# Optional inference engines, imported lazily inside the backends that need
# them. The core install (and CI) is deliberately GPU-free without them.
allowed-unresolved-imports = ["torch", "transformers", "openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
