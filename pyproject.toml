[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-stereotypes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pre-commit==4.4.0",
    "pre-commit-uv==4.3.0",
]
model = [
    "torch",
    "transformers",
    "accelerate",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["harness*", "legacy*"]

[tool.ruff]
line-length = 88
target-version = "py311"

extend-exclude = [
    "legacy/*.ipynb",
    "legacy/prompts.py",
    "legacy/utils.py",
    "legacy/BUGS.md",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

allowed-confusables = ["×"]

[tool.pytest.ini_options]
testpaths = ["tests"]
